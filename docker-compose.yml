services:

  opah-bancocarrefour-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: opah-bancocarrefour-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SenhaForte123!"
      MSSQL_PID: "Developer"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  opah-bancocarrefour-rabbitmq:
    image: rabbitmq:3-management
    container_name: opah-bancocarrefour-rabbitmq
    user: "0:0"

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "check_port_connectivity"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  opah-bancocarrefour-api:
    build:
      context: .
      dockerfile: Opah.BancoCarrefour.Api/Dockerfile

    container_name: opah-bancocarrefour-api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__SqlServerConn: "Server=opah-bancocarrefour-sqlserver;Database=BancoCarrefourTeste;User Id=sa;Password=SenhaForte123!;TrustServerCertificate=True;"

    depends_on:
      opah-bancocarrefour-sqlserver:
        condition: service_healthy


  opah-bancocarrefour-rabbitmq-worker:
    build:
      context: .
      dockerfile: Opah.BancoCarrefour.RabbitMQWorker/Dockerfile

    container_name: opah-bancocarrefour-rabbitmq-worker

    environment:
      DOTNET_ENVIRONMENT: "Development"

      ConnectionStrings__SqlServerConn: "Server=opah-bancocarrefour-sqlserver;Database=BancoCarrefourTeste;User Id=sa;Password=SenhaForte123!;TrustServerCertificate=True;"

      RabbitMq__HostName: "opah-bancocarrefour-rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "guest"
      RabbitMq__Password: "guest"

    depends_on:
      opah-bancocarrefour-sqlserver:
        condition: service_healthy

      opah-bancocarrefour-rabbitmq:
        condition: service_healthy

      opah-bancocarrefour-api:
        condition: service_started


volumes:
  sqlserver_data:
  rabbitmq_data: